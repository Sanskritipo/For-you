<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wait Wait 😘</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="card">

<h1>😘 Wait Wait!</h1>

<p>
Before we continue...
<br><br>
I have one very important requirement 💋
<br><br>
You must give me a kiss first ❤️
</p>

<button onclick="giveKiss()">
Chuppaaahh 💋
</button>

</div>

<script>

function giveKiss(){

alert("Chuppaaahh 😘❤️");

setTimeout(() => {
window.location.href = "page3.html";
}, 500);

}

// Floating hearts
for(let i=0;i<25;i++){

let heart =
document.createElement("div");

heart.className = "heart";

heart.innerHTML =
Math.random() > 0.5 ? "❤️" : "✨";

heart.style.left =
Math.random()*100 + "vw";

heart.style.fontSize =
(15 + Math.random()*20) + "px";

heart.style.animationDuration =
(6 + Math.random()*6) + "s";

document.body.appendChild(heart);

}

</script>

</body>
</html>
